<meta charset="utf-8">
<title>Production Ops Scorecard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

      --accent-soft: #17332F;

      --bad-soft: #3A211D;
      --neutral-chip: #232A20;

      --tag-360: #8C93D9;
      --tag-video: #D28FB1;
      --tag-catalog: #C3C46E;

  }
  :root[data-theme="dark"] {
    --bg: #101817;
    --surface: #172020;
    --surface-2: #1C2626;
    --border: #2B3937;
    --border-strong: #3C4C49;

    --ink-secondary: #AFC4C0;

    --neutral-ink: #BEC194;

  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink-primary);
    font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;

  .top {

    justify-content: space-between;
    align-items: flex-end;

  h1 {

  .refresh-btn {
    display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Sans', sans-serif;

  }
  .refresh-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; }

  .product-columns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; margin-bottom: 12px; }

  .product-body {

  }
  .metric-cell .metric-block {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;

  }
  .metric-block + .metric-block { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .metric-head {
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap;
    gap: 4px 16px; margin-bottom: 8px;
  }
  .metric-head .name-wrap { display: flex; align-items: baseline; gap: 9px; }
  .metric-head h4 {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 13.5px; margin: 0;
    letter-spacing: -0.005em; color: var(--ink-primary);
  }
  .metric-no-data { font-size: 11px; color: var(--ink-muted); }
  .metric-stats { display: flex; align-items: baseline; gap: 8px; }
  .metric-stats .v {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums;
    color: var(--ink-primary);

  .chart-card {

    background: var(--surface); color: var(--ink-muted); cursor: pointer; transition: background .15s, color .15s, border-color .15s;

  .seg-panel.active { display: block; }

<div class="page">
  <div class="top">
    <div>
      <p class="eyebrow">Ops Review</p>
      <h1>Production Ops Scorecard</h1>
      <p class="sub">Turnaround, SLA, fulfilment and unit-cost trends across Image, 360, Video and Catalog.</p>
      <p class="updated-chip">
        <span class="dot-live"></span>Last updated <span id="updatedStamp"><!-- UPDATED_START -->20 Aug 2026, 11:48 UTC<!-- UPDATED_END --></span>
        <button id="refreshBtn" class="refresh-btn" type="button"><span class="refresh-icon">⟳</span>Refresh</button>
      </p>
      <p id="refreshStatus" class="refresh-status"></p>
    </div>
    <div class="legend">
      <span class="item"><span class="dot" style="background:var(--good)"></span>Improved vs. prior period</span>
      <span class="item"><span class="dot" style="background:var(--bad)"></span>Slipped vs. prior period</span>
      <span class="item"><span class="dot" style="background:var(--ink-muted)"></span>Volume metric, no judgement</span>
    </div>
  </div>
  <p class="section-label">At a glance</p>
  <div class="glance" id="glance"></div>
  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" type="button" data-view="monthly">Monthly</button>
    <button class="view-tab" type="button" data-view="weekly">Weekly</button>
    <button class="view-tab" type="button" data-view="ent">ENT</button>
    <button class="view-tab" type="button" data-view="mid">MID</button>
    <button class="view-tab" type="button" data-view="smb">SMB</button>
  </div>
  <div id="sections"></div>
</div>
<script>
const MONTHS = ['Jun','Jul','Aug','Sep'];
// DATA_START \u2014 emptied; all data loads live from Google Sheet
let DATA = [];
let GLANCE_PICKS = {};
// DATA_END
function fmt(v, type) {
  if (v == null || Number.isNaN(v)) return '—';
  if (type === 'pct') return v.toFixed(1) + '%';
  if (type === 'hrs') return v.toFixed(1) + 'h';
  if (type === 'count') return Math.round(v).toLocaleString('en-US');
  return String(v);
}
function deltaFmt(delta, type) {
  const sign = delta > 0 ? '+' : (delta < 0 ? '−' : '±');
  const abs = Math.abs(delta);
  if (type === 'pct') return sign + abs.toFixed(1) + ' pp';
  if (type === 'hrs') return sign + abs.toFixed(1) + 'h';
  if (type === 'count') return sign + Math.round(abs).toLocaleString('en-US');
  return sign + abs;
}
function goodness(delta, dir) {
  if (dir === 'neutral' || delta == null) return 'neutral';
  if (delta === 0) return 'neutral';
  if (dir === 'up') return delta > 0 ? 'good' : 'bad';
  return delta < 0 ? 'good' : 'bad';
}
function latestAndPrior(monthly) {
  let latestIdx = -1;
  for (let i = MONTHS.length - 1; i >= 0; i--) {
    if (monthly[MONTHS[i]] != null) { latestIdx = i; break; }
  }
  if (latestIdx === -1) return { latestMonth:null, latestVal:null, priorMonth:null, priorVal:null };
  let priorIdx = -1;
  for (let j = latestIdx - 1; j >= 0; j--) {
    if (monthly[MONTHS[j]] != null) { priorIdx = j; break; }
  }
  return {
    latestMonth: MONTHS[latestIdx], latestVal: monthly[MONTHS[latestIdx]],
    priorMonth: priorIdx === -1 ? null : MONTHS[priorIdx],
    priorVal: priorIdx === -1 ? null : monthly[MONTHS[priorIdx]],
  };
}
function arrowSvg(kind) {
  if (kind === 'good' || kind === 'bad') {
    return '<svg viewBox="0 0 10 10" fill="none"><path d="M5 8V2M5 2L2 5M5 2L8 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="' + (kind === 'bad' ? 'rotate(180 5 5)' : '') + '"/></svg>';
  }
  return '<svg viewBox="0 0 10 10" fill="none"><path d="M2 5H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
}
function pill(delta, type, dir) {
  if (delta == null) return '<span class="dash">—</span>';
  const g = goodness(delta, dir);
  return `<span class="pill ${g}">${arrowSvg(g)}${deltaFmt(delta, type)}</span>`;
}
function emptyState(msg) {
  return `<div class="chart-empty">${msg}</div>`;
}
// Line chart with visible value labels on each point and category labels on the x-axis.
// Used for both the weekly (W-4 → W-1) and monthly (May → Aug) trend cards.
function lineChartSVG(categories, values, type, dir) {
  const pts = categories.map((c, i) => ({ c, v: values[i] })).filter(p => p.v != null);
  if (pts.length < 2) return emptyState('Not enough data points yet');
  const W = 240, H = 122, padL = 6, padR = 6, padTop = 18, padBottom = 20;
  const plotW = W - padL - padR, plotH = H - padTop - padBottom;
  const vals = pts.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || (Math.abs(max) * 0.2) || 1;
  const stepX = plotW / (pts.length - 1);
  const coords = pts.map((p, i) => ({
    x: padL + i * stepX,
    y: padTop + plotH - ((p.v - min) / range) * plotH,
    ...p,
  }));
  const linePath = coords.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaPath = linePath +
    ` L${coords[coords.length - 1].x.toFixed(1)},${(padTop + plotH).toFixed(1)}` +
    ` L${coords[0].x.toFixed(1)},${(padTop + plotH).toFixed(1)} Z`;
  const gridLines = [0, 0.5, 1].map(f => {
    const y = (padTop + plotH * f).toFixed(1);
    return `<line x1="${padL}" y1="${y}" x2="${padL + plotW}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  }).join('');
  const lastDelta = vals[vals.length - 1] - vals[vals.length - 2];
  const lastGoodness = dir ? goodness(lastDelta, dir) : 'neutral';
  const lastColor = lastGoodness === 'good' ? 'var(--good)' : lastGoodness === 'bad' ? 'var(--bad)' : 'var(--accent)';
  const marks = coords.map((p, i) => {
    const isLast = i === coords.length - 1;
    const nearTop = p.y - padTop < 11;
    const labelY = nearTop ? p.y + 12 : p.y - 7;
    return `
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast ? 3.4 : 2.4}" fill="${isLast ? lastColor : 'var(--accent)'}" stroke="var(--surface-2)" stroke-width="1.1"/>
      <text x="${p.x.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" class="chart-val">${fmt(p.v, type)}</text>
      <text x="${p.x.toFixed(1)}" y="${(padTop + plotH + 15).toFixed(1)}" text-anchor="middle" class="chart-cat">${p.c}</text>
    `;
  }).join('');
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <path d="${areaPath}" fill="var(--accent-soft)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${marks}
  </svg>`;
}
// Ent / Mid / SMB split card: one tab per segment, each showing that segment's own
// May → Aug trend (kept separate rather than compared, per segment, on demand).
const SEGMENTS = ['ENT', 'MID', 'SMB'];
function buildSegPanel(m, seg) {
  if (!m.seg) {
    return `<div class="chart-card"><p class="chart-title">${seg} trend</p>${emptyState('No ' + seg + ' split reported for this KR')}</div>`;
  }
  const cats = MONTHS.filter(mo => m.seg[mo] && m.seg[mo][seg] != null);
  const vals = cats.map(mo => m.seg[mo][seg]);
  if (cats.length < 1) {
    return `<div class="chart-card"><p class="chart-title">${seg} trend</p>${emptyState('No ' + seg + ' data available')}</div>`;
  }
  return `<div class="chart-card"><p class="chart-title">${seg} monthly trend</p>${lineChartSVG(cats, vals, m.type, m.dir)}</div>`;
}
function initials(name) {
  return name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
}
function renderEmpty() {
  document.getElementById('glance').innerHTML = '<p style="color:var(--ink-muted);font-size:13px;margin:0">No data yet — click <strong>Refresh</strong> to load live data from the sheet.</p>';
  document.getElementById('sections').innerHTML = '';
}
function renderGlance() {
  if (!DATA.length) { renderEmpty(); return; }
  const el = document.getElementById('glance');
  el.innerHTML = DATA.map(prod => {
    const picks = GLANCE_PICKS[prod.code].map(id => prod.metrics.find(m => m.id === id));
    let latestPeriod = null;
    for (const m of prod.metrics) {
      const { latestMonth } = latestAndPrior(m.monthly);
      if (latestMonth && (!latestPeriod || MONTHS.indexOf(latestMonth) > MONTHS.indexOf(latestPeriod))) latestPeriod = latestMonth;
    }
    const stats = picks.map(m => {
      const { latestVal, priorVal } = latestAndPrior(m.monthly);
      const delta = (latestVal != null && priorVal != null) ? latestVal - priorVal : null;
      return `<div class="glance-stat">
        <span class="label">${m.name}</span>
        <span class="valwrap"><span class="val">${fmt(latestVal, m.type)}</span>${pill(delta, m.type, m.dir)}</span>
      </div>`;
    }).join('');
    return `<div class="glance-card">
      <div class="glance-head"><span class="dot-lg" style="background:var(${prod.tag})"></span><h3>${prod.name}${latestPeriod ? `<span class="glance-period">${latestPeriod}</span>` : ''}</h3></div>
      <p class="glance-owner">${prod.owner}</p>
      <div class="glance-stats">${stats}</div>
    </div>`;
  }).join('');
}
const WEEK_LABELS = ['W-4', 'W-3', 'W-2', 'W-1'];
function buildMetricCard(m) {
  const { latestMonth, latestVal, priorMonth, priorVal } = latestAndPrior(m.monthly);
  const delta = (latestVal != null && priorVal != null) ? latestVal - priorVal : null;
  const noData = latestMonth == null;
  const monthCats = MONTHS.filter(mo => m.monthly[mo] != null);
  const monthVals = monthCats.map(mo => m.monthly[mo]);
  const weeklyChart = m.weekly
    ? lineChartSVG(WEEK_LABELS, m.weekly, m.type, m.dir)
    : emptyState('No weekly cadence tracked for this KR');
  const monthlyChart = lineChartSVG(monthCats, monthVals, m.type, m.dir);
  return `<div class="metric-block">
    <div class="metric-head">
      <div class="name-wrap">
        <h4>${m.name}</h4>
        ${noData ? '<span class="metric-no-data">Not yet reported</span>' : ''}
      </div>
      ${!noData ? `<div class="metric-stats">
        <span class="v">${fmt(latestVal, m.type)}</span><span class="period">${latestMonth}</span>
        ${priorMonth ? `<span class="vs-label">vs ${priorMonth}</span>${pill(delta, m.type, m.dir)}` : ''}
      </div>` : ''}
    </div>
    <div class="view-panel active" data-view="monthly">
      <div class="chart-card"><p class="chart-title">Monthly trend</p>${monthlyChart}</div>
    </div>
    <div class="view-panel" data-view="weekly">
      <div class="chart-card"><p class="chart-title">Last 4 weeks</p>${weeklyChart}</div>
    </div>
    <div class="view-panel" data-view="ent">${buildSegPanel(m, 'ENT')}</div>
    <div class="view-panel" data-view="mid">${buildSegPanel(m, 'MID')}</div>
    <div class="view-panel" data-view="smb">${buildSegPanel(m, 'SMB')}</div>
  </div>`;
}
// Canonical metric order — determines which row each metric type appears in
// Each slot: default matcher used for Image/360/Video; per-product key overrides for Catalog.
// This lets Catalog's Live Accounts sit beside TAT P95, and Website Reviews beside TAT P99.
const METRIC_ORDER = [
  { default: m => m.name.includes('P99'),
    catalog: m => m.name.toLowerCase().includes('live') },
  { default: m => m.name.toUpperCase().includes('SLA'),
    catalog: m => m.name.toLowerCase().includes('review') },
  { default: m => m.name.includes('P&L') || m.name.toLowerCase().includes('cost') },
  { default: m => /fulfi(l|ll)ment/i.test(m.name) },
];
function renderColumns() {
  const el = document.getElementById('sections');
  // Row 0 — product headers
  const headerCols = DATA.map(prod => {
    const hasAnyWeekly = prod.metrics.some(m => m.weekly);
    return `<div class="product-col">
      <div class="product-head">
        <div class="name-row">
          <span class="dot-lg" style="background:var(${prod.tag})"></span>
          <h2>${prod.name}</h2>
        </div>
        <div class="product-meta">
          <span class="owner-chip"><span class="avatar" style="background:var(${prod.tag})">${initials(prod.owner)}</span><span class="owner-name">${prod.owner}</span></span>
          <span class="cadence-note">${hasAnyWeekly ? 'Weekly + monthly' : 'Monthly only'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  // Rows 1-N — one band per slot; each product uses its own matcher override if defined
  const bands = METRIC_ORDER.map(slot => {
    const cells = DATA.map(prod => {
      const matcher = slot[prod.code] || slot.default;
      if (!matcher) return `<div class="metric-cell empty"></div>`;
      const m = prod.metrics.find(matcher);
      return m
        ? `<div class="metric-cell">${buildMetricCard(m)}</div>`
        : `<div class="metric-cell empty"></div>`;
    }).join('');
    // Skip row if every cell is empty
    const hasAny = DATA.some(prod => {
      const matcher = slot[prod.code] || slot.default;
      return matcher && prod.metrics.find(matcher);
    });
    return hasAny ? `<div class="metric-band">${cells}</div>` : '';
  }).join('');
  el.innerHTML = `<div class="product-columns">${headerCols}</div>${bands}`;
}
function initViewTabs() {
  const bar = document.getElementById('viewTabs');
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('.view-tab');
    if (!btn) return;
    const view = btn.getAttribute('data-view');
    bar.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.view-panel').forEach(p => p.classList.toggle('active', p.getAttribute('data-view') === view));
  });
}
// --- Live refresh: re-fetch the published sheet's CSV and rebuild DATA in the browser.
// Column layout (0-indexed): 0 #, 1 Product, 2 KR, 3-6 W-1..W-4,
// 7 Aug, 8-10 Aug ENT/MID/SMB, 11 July, 12-14 ENT/MID/SMB, 15 June, 16-18 ENT/MID/SMB,
// 19 May, 20-22 ENT/MID/SMB, 23 Owner.
const SHEET_PUBHTML = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0PErUtRrUBJqmRq-PGxpYaYr2ShfJHbyVOMjbXdCDDpw0-pPC4Fjmos2rqFa0t47WYf9ql9BRO3i_/pubhtml?gid=0&single=true';
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0PErUtRrUBJqmRq-PGxpYaYr2ShfJHbyVOMjbXdCDDpw0-pPC4Fjmos2rqFa0t47WYf9ql9BRO3i_/pub?gid=0&single=true&output=csv';
// Col layout: 0=ID,1=Product,2=KR,3-6=Weekly(4wks), 7=Sep,8-10=Sep ENT/MID/SMB, 11=Aug,12-14=Aug ENT/MID/SMB, 15=Jul,16-18=Jul ENT/MID/SMB, 19=Jun,20-22=Jun ENT/MID/SMB, 27=Owner
const MONTH_COLS = { Sep: 7, Aug: 11, Jul: 15, Jun: 19 };
const PRODUCT_TAG = { image: '--tag-image', '360': '--tag-360', video: '--tag-video', catalog: '--tag-catalog' };
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c === '\r') { /* skip */ }
    else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function cleanName(raw) {
  let name = (raw || '').trim().replace(/Fullfilment/gi, 'Fulfilment');
  name = name.replace(/\s*\(Hrs\)\s*$/i, '').replace(/\s*\(%\)\s*$/, '');
  name = name.replace(/SLA < (\d+)\s*Hrs/i, 'SLA < $1 Hrs');
  name = name.replace('P&L - Cost/Revenue', 'P&L — Cost / Revenue');
  if (/^live accounts count$/i.test(name)) name = 'Live Accounts';
  if (/^website review count$/i.test(name)) name = 'Website Reviews';
  return name.trim();
}
function classifyMetric(krName) {
  const n = krName.toLowerCase();
  if (n.includes('tat')) return { type: 'hrs', dir: 'down' };
  if (n.includes('sla')) return { type: 'pct', dir: 'up' };
  if (n.includes('p&l') || n.includes('cost')) return { type: 'pct', dir: 'down' };
  if (n.includes('fulfilment') || n.includes('fulfillment')) return { type: 'pct', dir: 'up' };
  if (n.includes('live accounts')) return { type: 'count', dir: 'up' };
  if (n.includes('review')) return { type: 'count', dir: 'neutral' };
  return { type: 'pct', dir: 'neutral' };
}
function toNum(raw) {
  const s = (raw || '').trim();
  if (s === '' || s.toUpperCase() === 'NA') return null;
  const n = parseFloat(s);
  return Number.isNaN(n) ? null : n;
}
function buildProductsFromRows(rows) {
  const body = rows.slice(1);
  const products = [];
  let current = null;
  for (const row of body) {
    if (!row.length || row.every(c => !c || !c.trim())) { current = null; continue; }
    const code = (row[0] || '').trim();
    if (!code) continue;
    const group = code.split('.')[0];
    const productName = (row[1] || '').trim();
    const owner = (row[27] || row[23] || '').trim(); // col 27 with Sep added; fallback 23
    if (!current || current._group !== group) {
      const slug = productName.toLowerCase();
      current = { _group: group, code: slug, name: productName, owner, tag: PRODUCT_TAG[slug] || '--tag-image', metrics: [] };
      products.push(current);
    }
    const krName = cleanName(row[2]);
    const { type, dir } = classifyMetric(krName);
    const weeklyRaw = [toNum(row[3]), toNum(row[4]), toNum(row[5]), toNum(row[6])];
    const weekly = weeklyRaw.every(v => v == null) ? null : [weeklyRaw[3], weeklyRaw[2], weeklyRaw[1], weeklyRaw[0]];
    const monthly = {};
    MONTHS.forEach(mo => { monthly[mo] = toNum(row[MONTH_COLS[mo]]); });
    let seg = {};
    MONTHS.forEach(mo => {
      const base = MONTH_COLS[mo];
      const ent = toNum(row[base + 1]), mid = toNum(row[base + 2]), smb = toNum(row[base + 3]);
      if (ent != null && mid != null && smb != null) seg[mo] = { ENT: ent, MID: mid, SMB: smb };
    });
    if (!Object.keys(seg).length) seg = null;
    current.metrics.push({ id: code.replace('.', ''), name: krName, type, dir, weekly, monthly, seg });
  }
  return products;
}
function pickGlance(metrics) {
  const reported = metrics.filter(m => Object.values(m.monthly).some(v => v != null));
  const pool = reported.length ? reported : metrics;
  const picks = [pool.find(m => m.dir === 'up'), pool.find(m => m.dir === 'down')].filter(Boolean);
  for (const m of pool) {
    if (picks.length >= 2) break;
    if (!picks.includes(m)) picks.push(m);
  }
  return picks.slice(0, 2).map(m => m.id);
}
function parseHTMLTable(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const table = doc.querySelector('table');
  if (!table) throw new Error('No table found in pubhtml');
  const rows = [];
  for (const tr of table.querySelectorAll('tr')) {
    const row = [];
    for (const td of tr.querySelectorAll('td, th')) {
      row.push(td.textContent.trim());
    }
    rows.push(row);
  }
  if (rows.length < 2) throw new Error('Table has no data rows');
  return rows;
}
async function fetchRows() {
  const bust = Date.now();
  // 1. CSV direct (works when opened locally or on unrestricted hosts)
  try {
    const res = await fetch(SHEET_CSV_URL + '&_t=' + bust, { cache: 'no-store' });
    if (res.ok) { const rows = parseCSV(await res.text()); if (rows.length > 1) return rows; }
  } catch(_) {}
  // 2. pubhtml direct
  try {
    const res = await fetch(SHEET_PUBHTML + '&_t=' + bust, { cache: 'no-store' });
    if (res.ok) { const rows = parseHTMLTable(await res.text()); if (rows.length > 1) return rows; }
  } catch(_) {}
  // 3. Ask Claude to fetch the data via its backend (works inside Artifact preview where CSP blocks direct fetches)
  try {
    const sample = window.claude ? await claude.use('sample') : null;
    if (sample) {
      const statusEl = document.getElementById('refreshStatus');
      if (statusEl) { statusEl.textContent = 'Fetching via Claude… (may take up to 30s)'; statusEl.classList.remove('error'); }
      const result = await sample.json(
        `Fetch this publicly published Google Sheets CSV URL and return its full contents as a JSON array of arrays of strings. The first element should be the header row. Return ONLY the raw JSON array with no markdown, no explanation, and no code blocks.\nURL: ${SHEET_CSV_URL}`
      );
      if (Array.isArray(result) && result.length > 1) return result;
    }
  } catch(_) {}
  // 4. CSV via corsproxy.io
  try {
    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(SHEET_CSV_URL), { cache: 'no-store' });
    if (res.ok) { const rows = parseCSV(await res.text()); if (rows.length > 1) return rows; }
  } catch(_) {}
  throw new Error('All fetch attempts failed');
}
async function refreshFromSheet() {
  const btn = document.getElementById('refreshBtn');
  const statusEl = document.getElementById('refreshStatus');
  btn.disabled = true;
  btn.classList.add('loading');
  statusEl.textContent = '';
  statusEl.classList.remove('error');
  try {
    const rows = await fetchRows();
    const products = buildProductsFromRows(rows);
    if (!products.length) throw new Error('No rows parsed from sheet');
    // Strip P&L — Cost / Revenue from Catalog (not tracked here)
    products.forEach(p => {
      if (p.code === 'catalog') p.metrics = p.metrics.filter(m => !m.name.includes('P&L'));
    });
    DATA = products.map(p => ({ code: p.code, name: p.name, owner: p.owner, tag: p.tag, metrics: p.metrics }));
    GLANCE_PICKS = {};
    products.forEach(p => { GLANCE_PICKS[p.code] = pickGlance(p.metrics); });
    renderGlance();
    renderColumns();
    const stamp = new Date().toLocaleString('en-GB', {
      day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
      timeZone: 'UTC', timeZoneName: 'short',
    });
    document.getElementById('updatedStamp').textContent = stamp;
  } catch (err) {
    statusEl.textContent = "Couldn't fetch live data — check that the sheet is published publicly (File → Share → Publish to web → Sheet1 → CSV).";
    statusEl.classList.add('error');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}
function loadFromCache() { return false; }
function initRefreshButton() {
  document.getElementById('refreshBtn').addEventListener('click', refreshFromSheet);
  // Auto-refresh every 1 hour
  setInterval(refreshFromSheet, 5 * 60 * 1000);
}
// Clear any old stale cache and always fetch fresh data on load
try { localStorage.removeItem('ops_cache'); } catch(_) {}
renderGlance();
renderColumns();
document.getElementById('updatedStamp').textContent = 'Loading…';
refreshFromSheet();
initViewTabs();
initRefreshButton();
</script>
