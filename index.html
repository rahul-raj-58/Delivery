// Project the selected region's values into each metric's monthly/seg fields
function getFilteredData() {
  if (CURRENT_TYPE === 'Region') {
    const reg = CURRENT_REGION;
    return REGION_PRODUCTS.map(prod => ({
      code: prod.code, name: prod.name, owner: reg, tag: prod.tag, type: 'Region',
      metrics: prod.metrics.map(m => {
        const rd = m.regionData && m.regionData[reg];
        return {
          id: m.id, name: m.name, type: m.type, dir: m.dir, weekly: null,
          monthly: rd ? rd.monthly : {Jun:null,Jul:null,Aug:null,Sep:null},
          seg: rd ? rd.seg : null,
        };
      })
    }));
  }
  if (!CURRENT_TYPE) return DATA;
  return DATA.filter(p => p.type === CURRENT_TYPE);
}
function fmt(v, type) {
  if (v == null || Number.isNaN(v)) return '—';
  if (type === 'pct') return v.toFixed(1) + '%';
  if (type === 'hrs') return v.toFixed(1) + 'h';
  if (type === 'count') return Math.round(v).toLocaleString('en-US');
  return String(v);
}
function deltaFmt(delta, type) {
  const sign = delta > 0 ? '+' : (delta < 0 ? '−' : '±');
  const abs = Math.abs(delta);
  if (type === 'pct') return sign + abs.toFixed(1) + ' pp';
  if (type === 'hrs') return sign + abs.toFixed(1) + 'h';
  if (type === 'count') return sign + Math.round(abs).toLocaleString('en-US');
  return sign + abs;
}
function goodness(delta, dir) {
  if (dir === 'neutral' || delta == null) return 'neutral';
  if (delta === 0) return 'neutral';
  if (dir === 'up') return delta > 0 ? 'good' : 'bad';
  return delta < 0 ? 'good' : 'bad';
}
function latestAndPrior(monthly) {
  let latestIdx = -1;
  for (let i = MONTHS.length - 1; i >= 0; i--) {
    if (monthly[MONTHS[i]] != null) { latestIdx = i; break; }
  }
  if (latestIdx === -1) return { latestMonth:null, latestVal:null, priorMonth:null, priorVal:null };
  let priorIdx = -1;
  for (let j = latestIdx - 1; j >= 0; j--) {
    if (monthly[MONTHS[j]] != null) { priorIdx = j; break; }
  }
  return {
    latestMonth: MONTHS[latestIdx], latestVal: monthly[MONTHS[latestIdx]],
    priorMonth: priorIdx === -1 ? null : MONTHS[priorIdx],
    priorVal: priorIdx === -1 ? null : monthly[MONTHS[priorIdx]],
  };
}
function arrowSvg(kind) {
  if (kind === 'good' || kind === 'bad') {
    return '<svg viewBox="0 0 10 10" fill="none"><path d="M5 8V2M5 2L2 5M5 2L8 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="' + (kind === 'bad' ? 'rotate(180 5 5)' : '') + '"/></svg>';
  }
  return '<svg viewBox="0 0 10 10" fill="none"><path d="M2 5H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
}
function pill(delta, type, dir) {
  if (delta == null) return '<span class="dash">—</span>';
  const g = goodness(delta, dir);
  return `<span class="pill ${g}">${arrowSvg(g)}${deltaFmt(delta, type)}</span>`;
}
function emptyState(msg) {
  return `<div class="chart-empty">${msg}</div>`;
}
// Line chart with visible value labels on each point and category labels on the x-axis.
// Used for both the weekly (W-4 → W-1) and monthly (May → Aug) trend cards.
function lineChartSVG(categories, values, type, dir) {
  const pts = categories.map((c, i) => ({ c, v: values[i] })).filter(p => p.v != null);
  if (pts.length < 2) return emptyState('Not enough data points yet');
  // Wider viewBox (3:1 ratio) keeps charts compact in 3-column layouts
  const W = 360, H = 120, padL = 30, padR = 30, padTop = 28, padBottom = 26;
  const plotW = W - padL - padR, plotH = H - padTop - padBottom;
  const vals = pts.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || (Math.abs(max) * 0.2) || 1;
  const stepX = plotW / (pts.length - 1);
  const coords = pts.map((p, i) => ({
    x: padL + i * stepX,
    y: padTop + plotH - ((p.v - min) / range) * plotH,
    ...p,
  }));
  const linePath = coords.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaPath = linePath +
    ` L${coords[coords.length - 1].x.toFixed(1)},${(padTop + plotH).toFixed(1)}` +
    ` L${coords[0].x.toFixed(1)},${(padTop + plotH).toFixed(1)} Z`;
  const gridLines = [0, 0.5, 1].map(f => {
    const y = (padTop + plotH * f).toFixed(1);
    return `<line x1="${padL}" y1="${y}" x2="${padL + plotW}" y2="${y}" stroke="var(--border)" stroke-width="0.8" stroke-dasharray="4,3"/>`;
  }).join('');
  const lastDelta = vals[vals.length - 1] - vals[vals.length - 2];
  const lastGoodness = dir ? goodness(lastDelta, dir) : 'neutral';
  const lastColor = lastGoodness === 'good' ? 'var(--good)' : lastGoodness === 'bad' ? 'var(--bad)' : 'var(--accent)';
  const n = coords.length;
  const marks = coords.map((p, i) => {
    const isFirst = i === 0;
    const isLast = i === n - 1;
    // Edge-aware text anchor prevents clipping at left/right bounds
    const anchor = isFirst ? 'start' : isLast ? 'end' : 'middle';
    const nearTop = p.y - padTop < 16;
    const labelY = nearTop ? p.y + 16 : p.y - 9;
    const dotR = isLast ? 5 : 3.5;
    const dotColor = isLast ? lastColor : 'var(--accent)';
    return `
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${dotR + 3.5}" fill="${dotColor}" opacity="0.13"/>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${dotR}" fill="${dotColor}" stroke="var(--surface)" stroke-width="1.8"/>
      <text x="${p.x.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="${anchor}" class="chart-val">${fmt(p.v, type)}</text>
      <text x="${p.x.toFixed(1)}" y="${(padTop + plotH + 19).toFixed(1)}" text-anchor="${anchor}" class="chart-cat">${p.c}</text>
    `;
  }).join('');
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#areaGrad)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${marks}
  </svg>`;
}
// Ent / Mid / SMB split card: one tab per segment, each showing that segment's own
// May → Aug trend (kept separate rather than compared, per segment, on demand).
const SEGMENTS = ['ENT', 'MID', 'SMB'];
function buildSegPanel(m, seg) {
  if (!m.seg) {
    return `<div class="chart-card"><p class="chart-title">${seg} trend</p>${emptyState('No ' + seg + ' split reported for this KR')}</div>`;
  }
  const cats = MONTHS.filter(mo => m.seg && m.seg[mo] && m.seg[mo][seg] != null);
  const vals = cats.map(mo => m.seg[mo][seg]);
  if (cats.length < 1) {
    return `<div class="chart-card"><p class="chart-title">${seg} trend</p>${emptyState('No ' + seg + ' data available')}</div>`;
  }
  return `<div class="chart-card"><p class="chart-title">${seg} monthly trend</p>${lineChartSVG(cats, vals, m.type, m.dir)}</div>`;
}
function initials(name) {
  return name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
}
function renderEmpty() {
  const inArtifact = typeof window.claude !== 'undefined';
  const msg = inArtifact
    ? 'Click <strong>Refresh</strong> above — Claude will ask permission to fetch your sheet data. Click <strong>Allow</strong> when prompted.'

  document.getElementById('sections').innerHTML = '';
}
function renderGlance() {
  const fd = getFilteredData();
  if (!fd.length) { renderEmpty(); return; }
  const el = document.getElementById('glance');
  el.innerHTML = fd.map(prod => {
    const picks = CURRENT_TYPE === 'Region'
      ? prod.metrics.slice(0, 2)
      : GLANCE_PICKS[prod.code].map(id => prod.metrics.find(m => m.id === id));
    let latestPeriod = null;
    for (const m of prod.metrics) {
      const { latestMonth } = latestAndPrior(m.monthly);
      if (latestMonth && (!latestPeriod || MONTHS.indexOf(latestMonth) > MONTHS.indexOf(latestPeriod))) latestPeriod = latestMonth;
    }
    const stats = picks.map(m => {
      const { latestVal, priorVal } = latestAndPrior(m.monthly);
      const delta = (latestVal != null && priorVal != null) ? latestVal - priorVal : null;
      return `<div class="glance-stat">
        <span class="label">${m.name}</span>
        <span class="valwrap"><span class="val">${fmt(latestVal, m.type)}</span>${pill(delta, m.type, m.dir)}</span>
      </div>`;
    }).join('');
    return `<div class="glance-card">
      <div class="glance-head"><span class="dot-lg" style="background:var(${prod.tag})"></span><h3>${prod.name}${latestPeriod ? `<span class="glance-period">${latestPeriod}</span>` : ''}</h3></div>
      <p class="glance-owner">${prod.owner}</p>
      <div class="glance-stats">${stats}</div>
    </div>`;
  }).join('');
}
const WEEK_LABELS = ['W-4', 'W-3', 'W-2', 'W-1'];

    </div>
    <div class="view-panel active" data-view="monthly">
      <div class="chart-card"><p class="chart-title">Monthly trend</p>${monthlyChart}</div>
    </div>
    <div class="view-panel" data-view="weekly">
      <div class="chart-card"><p class="chart-title">Last 4 weeks</p>${weeklyChart}</div>
    </div>
    <div class="view-panel" data-view="ent">${buildSegPanel(m, 'ENT')}</div>
    <div class="view-panel" data-view="mid">${buildSegPanel(m, 'MID')}</div>
    <div class="view-panel" data-view="smb">${buildSegPanel(m, 'SMB')}</div>
  </div>`;
}
// Canonical metric order — row slot for each metric type across Image / 360 / Video
const METRIC_ORDER = [
  { default: m => m.name.includes('P99') },
  { default: m => m.name.toUpperCase().includes('SLA') },
  { default: m => m.name.includes('P&L') || m.name.toLowerCase().includes('cost') },
  { default: m => /fulfi(l|ll)ment/i.test(m.name) },
];
function renderColumns() {
  const fd = getFilteredData();
  const el = document.getElementById('sections');
  const cols = fd.length || 1;
  // Cap columns for few products so they don't stretch impossibly wide
  const colWidth = cols === 1 ? 'minmax(0,600px)' : cols === 2 ? 'minmax(0,640px)' : 'minmax(0,1fr)';
  const gridStyle = `grid-template-columns:repeat(${cols},${colWidth})`;
  // Row 0 — product headers
  const headerCols = fd.map(prod => {
    const hasAnyWeekly = prod.metrics.some(m => m.weekly);
    return `<div class="product-col">
      <div class="product-head">
        <div class="name-row">
          <span class="dot-lg" style="background:var(${prod.tag})"></span>
          <h2>${prod.name}</h2>
        </div>
        <div class="product-meta">
          <span class="owner-chip"><span class="avatar" style="background:var(${prod.tag})">${initials(prod.owner)}</span><span class="owner-name">${prod.owner}</span></span>
          <span class="cadence-note">${hasAnyWeekly ? 'Weekly + monthly' : 'Monthly only'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  // Rows 1-N — one band per slot
  const bands = METRIC_ORDER.map(slot => {
    const cells = fd.map(prod => {
      const matcher = slot.default;
      if (!matcher) return `<div class="metric-cell empty"></div>`;
      const m = prod.metrics.find(matcher);
      return m
        ? `<div class="metric-cell">${buildMetricCard(m)}</div>`
        : `<div class="metric-cell empty"></div>`;
    }).join('');
    const hasAny = fd.some(prod => slot.default && prod.metrics.find(slot.default));
    return hasAny ? `<div class="metric-band" style="${gridStyle}">${cells}</div>` : '';
  }).join('');
  el.innerHTML = `<div class="product-columns" style="${gridStyle}">${headerCols}</div>${bands}`;
}
function initViewTabs() {
  const bar = document.getElementById('viewTabs');
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('.view-tab');
    if (!btn) return;
    const view = btn.getAttribute('data-view');
    bar.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b === btn));

// --- Live refresh: re-fetch the published sheet's CSV and rebuild DATA in the browser.
// Column layout (0-indexed): 0 #, 1 Product, 2 KR, 3-6 W-1..W-4,
// 7 Aug, 8-10 Aug ENT/MID/SMB, 11 July, 12-14 ENT/MID/SMB, 15 June, 16-18 ENT/MID/SMB,
// 19 May, 20-22 ENT/MID/SMB, 23 Owner.
const SHEET_PUBHTML = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0PErUtRrUBJqmRq-PGxpYaYr2ShfJHbyVOMjbXdCDDpw0-pPC4Fjmos2rqFa0t47WYf9ql9BRO3i_/pubhtml?gid=0&single=true';
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0PErUtRrUBJqmRq-PGxpYaYr2ShfJHbyVOMjbXdCDDpw0-pPC4Fjmos2rqFa0t47WYf9ql9BRO3i_/pub?gid=0&single=true&output=csv';
// Col layout: 0=#, 1=VIN(code), 2=Product, 3=KR, 4-7=W1-W4, 8=Sep, 9-11=Sep ENT/MID/SMB, 12=Aug, 13-15=Aug ENT/MID/SMB, 16=Jul, 17-19=Jul ENT/MID/SMB, 20=Jun, 21-23=Jun ENT/MID/SMB, 28=Owner
const MONTH_COLS = { Sep: 8, Aug: 12, Jul: 16, Jun: 20 };
const PRODUCT_TAG = { image: '--tag-image', '360': '--tag-360', video: '--tag-video', catalog: '--tag-catalog' };
// Default type for known products if col B is blank in the live sheet
const PRODUCT_TYPE_DEFAULT = { image: 'VIN', '360': 'VIN', video: 'VIN' };
// Product slugs to always exclude from the dashboard
const SKIP_PRODUCTS = new Set(['catalog', 'product', 'objective', '']);
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c === '\r') { /* skip */ }
    else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function cleanName(raw) {
  let name = (raw || '').trim().replace(/Fullfilment/gi, 'Fulfilment');
  name = name.replace(/\s*\(Hrs\)\s*$/i, '').replace(/\s*\(%\)\s*$/, '');
  name = name.replace(/SLA < (\d+)\s*Hrs/i, 'SLA < $1 Hrs');
  name = name.replace('P&L - Cost/Revenue', 'P&L — Cost / Revenue');
  if (/^live accounts count$/i.test(name)) name = 'Live Accounts';
  if (/^website review count$/i.test(name)) name = 'Website Reviews';
  return name.trim();
}
function classifyMetric(krName) {
  const n = krName.toLowerCase();
  if (n.includes('tat')) return { type: 'hrs', dir: 'down' };
  if (n.includes('sla')) return { type: 'pct', dir: 'up' };
  if (n.includes('p&l') || n.includes('cost')) return { type: 'pct', dir: 'down' };
  if (n.includes('fulfilment') || n.includes('fulfillment')) return { type: 'pct', dir: 'up' };
  if (n.includes('live accounts')) return { type: 'count', dir: 'up' };
  if (n.includes('review')) return { type: 'count', dir: 'neutral' };
  return { type: 'pct', dir: 'neutral' };
}
function toNum(raw) {
  const s = (raw || '').trim();
  if (s === '' || s.toUpperCase() === 'NA') return null;
  const n = parseFloat(s);
  return Number.isNaN(n) ? null : n;
}
function buildProductsFromRows(rows) {
  const body = rows.slice(1);
  const products = [];
  let current = null;
  for (const row of body) {
    if (!row.length || row.every(c => !c || !c.trim())) { current = null; continue; }
    const code = (row[0] || '').trim();
    const col1 = (row[1] || '').trim();
    const col2 = (row[2] || '').trim();
    const col3 = (row[3] || '').trim();
    // Region sub-row: no # code, no type, region name in col 2, no KR name
    if (!code && current && current.type === 'Region' && REGIONS_SET.has(col2) && !col3) {
      const lastMetric = current.metrics[current.metrics.length - 1];
      if (lastMetric) {
        if (!lastMetric.regionData) lastMetric.regionData = {};
        const monthly = {};
        MONTHS.forEach(mo => { monthly[mo] = toNum(row[MONTH_COLS[mo]]); });
        const seg = {};
        MONTHS.forEach(mo => {
          const base = MONTH_COLS[mo];
          const ent = toNum(row[base+1]), mid = toNum(row[base+2]), smb = toNum(row[base+3]);
          if (ent != null || mid != null || smb != null) seg[mo] = {ENT:ent, MID:mid, SMB:smb};
        });
        lastMetric.regionData[col2] = { monthly, seg: Object.keys(seg).length ? seg : null };
      }
      continue;
    }
    if (!code) continue;
    const group = code.split('.')[0];
    const productType = col1; // col 1 = Type code (e.g. VIN / Region)
    const productName = col2; // col 2 = Product name
    const owner = (row[28] || row[24] || '').trim(); // col 28 = Owner
    if (!current || current._group !== group) {
      const slug = productName.toLowerCase();
      // Skip header rows, Catalog, and placeholder products
      if (!productName || SKIP_PRODUCTS.has(slug) || productName === 'Objective / Key Result') { current = null; continue; }
      const resolvedType = productType || PRODUCT_TYPE_DEFAULT[slug] || 'VIN';
      current = { _group: group, code: slug, name: productName, owner, type: resolvedType, tag: PRODUCT_TAG[slug] || '--tag-image', metrics: [] };
      products.push(current);
    }
    const krName = cleanName(col3); // col 3 = KR name
    const { type, dir } = classifyMetric(krName);
    const weeklyRaw = [toNum(row[4]), toNum(row[5]), toNum(row[6]), toNum(row[7])]; // cols 4-7 = W1-W4
    const weekly = weeklyRaw.every(v => v == null) ? null : [weeklyRaw[3], weeklyRaw[2], weeklyRaw[1], weeklyRaw[0]];
    const monthly = {};
    MONTHS.forEach(mo => { monthly[mo] = toNum(row[MONTH_COLS[mo]]); });
    let seg = {};
    MONTHS.forEach(mo => {
      const base = MONTH_COLS[mo];
      const ent = toNum(row[base + 1]), mid = toNum(row[base + 2]), smb = toNum(row[base + 3]);
      if (ent != null || mid != null || smb != null) seg[mo] = { ENT: ent, MID: mid, SMB: smb };
    });
    if (!Object.keys(seg).length) seg = null;
    current.metrics.push({ id: code.replace('.', ''), name: krName, type, dir, weekly, monthly, seg });
  }
  return products;
}
function pickGlance(metrics) {
  const reported = metrics.filter(m => Object.values(m.monthly).some(v => v != null));
  const pool = reported.length ? reported : metrics;
  const picks = [pool.find(m => m.dir === 'up'), pool.find(m => m.dir === 'down')].filter(Boolean);
  for (const m of pool) {
    if (picks.length >= 2) break;
    if (!picks.includes(m)) picks.push(m);
  }
  return picks.slice(0, 2).map(m => m.id);
}
function parseHTMLTable(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const table = doc.querySelector('table');
  if (!table) throw new Error('No table found in pubhtml');
  const rows = [];
  for (const tr of table.querySelectorAll('tr')) {
    const row = [];
    for (const td of tr.querySelectorAll('td, th')) {
      row.push(td.textContent.trim());
    }
    rows.push(row);
  }
  if (rows.length < 2) throw new Error('Table has no data rows');
  return rows;
}
async function fetchRows(statusEl) {
  const bust = Date.now();

  // 1. Direct CSV fetch — works when opened locally in Chrome
  try {
    const res = await fetch(SHEET_CSV_URL + '&_t=' + bust, { cache: 'no-store' });
    if (res.ok) { const rows = parseCSV(await res.text()); if (rows.length > 1) return rows; }
  } catch(_) {}

  // 2. Direct pubhtml fetch
  try {
    const res = await fetch(SHEET_PUBHTML + '&_t=' + bust, { cache: 'no-store' });
    if (res.ok) { const rows = parseHTMLTable(await res.text()); if (rows.length > 1) return rows; }
  } catch(_) {}

  // 3. Claude backend fetch — works inside Artifact preview (claude.ai blocks direct fetches via CSP)
  if (typeof window.claude !== 'undefined') {
    const sample = await claude.use('sample');
    if (sample) {
      if (statusEl) { statusEl.textContent = 'Fetching via Claude… click Allow if a permission prompt appears (up to 30s)'; statusEl.classList.remove('error'); }
      try {
        const result = await sample.json(
          `Fetch this publicly-published Google Sheets CSV URL and return its full contents as a JSON 2D array of strings (rows × columns). First array element must be the header row. Return ONLY valid JSON — no markdown, no explanation, no code fences.\nURL: ${SHEET_CSV_URL}`
        );
        if (Array.isArray(result) && result.length > 1) return result;
        throw new Error('Empty or invalid data returned');
      } catch(e) {
        const code = e && e.code;
        if (code === 'not_granted') throw new Error('Permission denied — when the Allow prompt appears, click Allow to let Claude fetch your sheet.');
        if (code === 'rate_limited') throw new Error('Rate limited — wait a moment then click Refresh again.');
        throw new Error(e && e.message ? e.message : 'Claude fetch failed');
      }
    }
  }

  // 4. Corsproxy fallback
  try {
    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(SHEET_CSV_URL), { cache: 'no-store' });
    if (res.ok) { const rows = parseCSV(await res.text()); if (rows.length > 1) return rows; }
  } catch(_) {}

  throw new Error('All fetch methods failed. Try downloading the HTML and opening it directly in Chrome.');
}
async function refreshFromSheet() {
  const btn = document.getElementById('refreshBtn');
  const statusEl = document.getElementById('refreshStatus');
  btn.disabled = true;
  btn.classList.add('loading');
  statusEl.textContent = '';
  statusEl.classList.remove('error');
  try {
    const rows = await fetchRows(statusEl);
    const products = buildProductsFromRows(rows);
    if (!products.length) throw new Error('No rows parsed from sheet');
    const vinProducts = products.filter(p => p.type !== 'Region');
    const regProducts = products.filter(p => p.type === 'Region');
    DATA = vinProducts.map(p => ({ code: p.code, name: p.name, owner: p.owner, type: p.type, tag: p.tag, metrics: p.metrics }));
    // Merge live region sub-row data into REGION_PRODUCTS
    if (regProducts.length) {
      for (const parsedProd of regProducts) {
        const target = REGION_PRODUCTS.find(rp => rp.code === parsedProd.code);
        if (!target) continue;
        for (const parsedMetric of parsedProd.metrics) {
          if (!parsedMetric.regionData) continue;
          const targetMetric = target.metrics.find(tm => tm.name === parsedMetric.name);
          if (targetMetric) Object.assign(targetMetric.regionData, parsedMetric.regionData);
        }
      }
    }
    GLANCE_PICKS = {};
    vinProducts.forEach(p => { GLANCE_PICKS[p.code] = pickGlance(p.metrics); });
    // Reset filter if current type no longer exists in fresh data
    const freshTypes = sortedTypes();
    if (!freshTypes.includes(CURRENT_TYPE)) CURRENT_TYPE = freshTypes[0] || '';
    buildTypeFilter();
    renderGlance();
    renderColumns();
    const stamp = new Date().toLocaleString('en-GB', {
      day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
      timeZone: 'UTC', timeZoneName: 'short',
    });
    document.getElementById('updatedStamp').textContent = stamp;
  } catch (err) {
    statusEl.textContent = err.message || "Couldn't fetch live data — check that the sheet is published publicly.";
    statusEl.classList.add('error');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}
function loadFromCache() { return false; }
function initRegionDropdown() {
  document.getElementById('regionSelect').addEventListener('change', e => {
    CURRENT_REGION = e.target.value;

function sortedTypes() {
  const types = [...new Set(DATA.map(p => p.type).filter(Boolean))];
  if (!types.includes('Region')) types.push('Region');
  types.sort((a, b) => {
    if (a === 'VIN') return -1;
    if (b === 'VIN') return 1;
    if (a === 'Region') return 1;
    if (b === 'Region') return -1;
    return a.localeCompare(b);
  });
  return types;
}
function buildTypeFilter() {
  const bar = document.getElementById('typeFilter');
  const types = sortedTypes();
  bar.innerHTML = types.map(t =>
    `<button class="type-tab${t === CURRENT_TYPE ? ' active' : ''}" type="button" data-type="${t}">${t}</button>`
  ).join('');
}
function initTypeFilter() {
  // Set default to VIN if available, else first available type
  const types = sortedTypes();
  if (!types.includes(CURRENT_TYPE)) CURRENT_TYPE = types[0] || '';
  buildTypeFilter();
  document.getElementById('typeFilter').addEventListener('click', e => {
    const btn = e.target.closest('.type-tab');
    if (!btn) return;
    CURRENT_TYPE = btn.getAttribute('data-type');
    document.querySelectorAll('.type-tab').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('regionFilterRow').classList.toggle('visible', CURRENT_TYPE === 'Region');
    renderGlance();
    renderColumns();
  });
}
// Clear any stale cache
try { localStorage.removeItem('ops_cache'); } catch(_) {}

  : 'Showing last known data — click Refresh to fetch live data from the sheet.'; }
